<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My HG Homepage</title>
    <style>
        :root {
            --primary-color: #4a90e2;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        /* 页签样式 */
        .tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            padding: 10px 20px;
            border: none;
            background: #ddd;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.3s;
        }

        .tab-btn.active {
            background: var(--primary-color);
            color: white;
        }

        /* 链接卡片网格 */
        .link-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 20px;
            display: none; /* 默认隐藏，通过JS控制显示 */
        }

        .link-grid.active {
            display: grid;
        }

        .card {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            text-decoration: none;
            color: var(--text-color);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }

        .card img {
            width: 32px;
            height: 32px;
            margin-bottom: 10px;
        }

        .card span {
            display: block;
            font-size: 14px;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Main Navigator</h1>
    </header>

    <div class="tabs" id="tabBox">
        <button class="tab-btn active" onclick="showCategory('web')">常用网页</button>
        <button class="tab-btn" onclick="showCategory('social')">社交娱乐</button>
        <button class="tab-btn" onclick="showCategory('tools')">实用工具</button>
    </div>

    <div id="web" class="link-grid active">
        <a href="https://www.baidu.com" class="card" target="_blank">
            <img src="https://www.baidu.com/favicon.ico" alt="Baidu">
            <span>百度</span>
        </a>
        <a href="https://www.google.com" class="card" target="_blank">
            <img src="https://www.google.com/favicon.ico" alt="Google">
            <span>Google</span>
        </a>
        <a href="https://www.youtube.com" class="card" target="_blank">
            <img src="https://www.youtube.com/favicon.ico" alt="Youtube">
            <span>油管</span>
        </a>
        <a href="https://github.com" class="card" target="_blank">
            <img src="https://github.com/favicon.ico" alt="Github">
            <span>GitHub</span>
        </a>
        <a href="https://www.x.com" class="card" target="_blank">
            <img src="https://www.x.com/favicon.ico" alt="X">
            <span>推特</span>
        </a>
        <a href="https://bilibili.com" class="card" target="_blank">
            <img src="https://www.bilibili.com/favicon.ico" alt="bilibili">
            <span>B站</span>
        </a>
        <a href="https://www.zhihu.com" class="card" target="_blank">
            <img src="https://www.zhihu.com/favicon.ico" alt="zhihu">
            <span>知乎</span>
        </a>
    </div>

    <div id="social" class="link-grid">
        <a href="https://weibo.com" class="card" target="_blank">
            <span>微博</span>
        </a>
        <a href="https://bilibili.com" class="card" target="_blank">
            <span>Bilibili</span>
        </a>
    </div>

    <div id="tools" class="link-grid">
        <a href="https://google.com" class="card" target="_blank">
            <span>Google</span>
        </a>
        <a href="https://translate.google.com" class="card" target="_blank">
            <span>翻译</span>
        </a>
    </div>
</div>

<script>
    function showCategory(categoryId) {
        // 隐藏所有分类内容
        const contents = document.querySelectorAll('.link-grid');
        contents.forEach(content => content.classList.remove('active'));

        // 取消所有按钮激活状态
        const buttons = document.querySelectorAll('.tab-btn');
        buttons.forEach(btn => btn.classList.remove('active'));

        // 显示当前选中的分类
        document.getElementById(categoryId).classList.add('active');
        
        // 激活当前按钮
        event.currentTarget.classList.add('active');
    }
</script>

</body>
</html>
